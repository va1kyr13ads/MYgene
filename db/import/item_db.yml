  # MYgene Legendary Bubble Gum: guarantee every eligible drop entry
  # for the using player on monster kills during a 15-second window.
  # Includes mob database, map bonus, MVP and MYgene scripted drops.
  # The script timestamp is checked at monster death; no general rate
  # bonus is applied and other players' drops are not affected.
  - Id: 31009
    AegisName: MYGENE_LEGENDARY_BUBBLE_GUM
    Name: Legendary Bubble Gum
    Type: Usable
    Buy: 2
    Weight: 10
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      MYGENE_LEGENDARY_GUM_UNTIL = gettimetick(2) + 15;
      dispbottom "Legendary Bubble Gum: guaranteed monster drops for 15 seconds.";
      // Cosmetic only: existing RO blessing sparkle at activation.
      specialeffect2 EF_BLESSING;
      // One per-player aura loop; repeated uses extend the timer rather
      // than stacking many visual timers.
      if (!@MYGENE_GUM_AURA_LOOP) {
        @MYGENE_GUM_AURA_LOOP = 1;
        addtimer 2500,"MYgene_Legendary_Gum_Aura::OnPulse";
      }

