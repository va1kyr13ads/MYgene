# MYgene: Yellow Fabre exclusive rewards.
# Do not specify AliasName: rAthena sends the alias ITEM ID to clients, which
# would hide the new IDs, names and slot metadata. The companion MYgene client
# maps these custom IDs to existing Knife, Fabre Card and Center Potion
# graphics in its own ItemInfo fallback. Knife combat proc is in battle.cpp.
Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 31001
    AegisName: MYGENE_FABRE_SLAYER
    Name: Fabre Slayer Knife
    Type: Weapon
    SubType: Dagger
    Buy: 10000
    Weight: 400
    Attack: 17
    Range: 1
    Slots: 1
    WeaponLevel: 1
    EquipLevelMin: 1
    Refineable: false
    Jobs:
      All: true
    Locations:
      Right_Hand: true
    View: 1

  # Stage 1: standalone Perfect knife. World supply and leasing remain OFF.
  # Only the World Relic Keeper GM-test upgrade currently creates this variant.
  - Id: 31004
    AegisName: MYGENE_PERFECT_FABRE_SLAYER
    Name: P.F.S.K
    Type: Weapon
    SubType: Dagger
    Buy: 10000
    Weight: 1000  # rAthena units: displays Weight 100
    Attack: 25
    Range: 2
    Slots: 1
    WeaponLevel: 4
    EquipLevelMin: 40
    Refineable: false
    Jobs:
      All: true
    Locations:
      Right_Hand: true
    View: 1
    Script: |
      bonus bUnbreakableWeapon;

  - Id: 31002
    AegisName: MYGENE_YELLOW_FABRE_CARD
    Name: Yellow Fabre Card
    Type: Card
    Buy: 20
    Weight: 10
    Locations:
      Right_Hand: true

  - Id: 31003
    AegisName: MYGENE_ATTRACTION_POTION
    Name: Attraction Potion
    Type: Usable
    Buy: 1000
    Weight: 50
    Script: |
      MYGENE_ATTRACTION_UNTIL = gettimetick(2) + 300;
      dispbottom "Attraction Potion: 70% enhanced field-monster aggro for 5 minutes.";

  # Red Thief Bug Slayer family. The normal weapon exactly mirrors the
  # Fabre Slayer Knife's numeric item base, except sword weapon subtype.
  # Server-side execution proc is implemented separately in battle.cpp.
  - Id: 31006
    AegisName: MYGENE_THIEF_BUG_SLAYER
    Name: Thief Bug Slayer Sword
    Type: Weapon
    SubType: 1hSword
    Buy: 10000
    Weight: 400
    Attack: 17
    Range: 1
    Slots: 1
    WeaponLevel: 1
    EquipLevelMin: 1
    Refineable: false
    Jobs:
      All: true
    Locations:
      Right_Hand: true
    View: 2

  # Distinct from the standard vanilla Thief Bug Card.
  - Id: 31007
    AegisName: MYGENE_RED_THIEF_BUG_CARD
    Name: Red Thief Bug Card
    Type: Card
    Buy: 20
    Weight: 10
    Locations:
      Right_Hand: true

  # Crafted-only World Relic, not a monster drop. Future registry-gated
  # creation must follow the Perfect Fabre Slayer Knife safety checks.
  - Id: 31008
    AegisName: MYGENE_PERFECT_THIEF_BUG_SLAYER
    Name: P.T.B.S
    Type: Weapon
    SubType: 1hSword
    Buy: 10000
    Weight: 1000
    Attack: 25
    Range: 2
    Slots: 1
    WeaponLevel: 4
    EquipLevelMin: 40
    Refineable: false
    Jobs:
      All: true
    Locations:
      Right_Hand: true
    View: 2
    Script: |
      bonus bUnbreakableWeapon;
